# Railway configuration for the Celery worker service.
# Same repository, Root Directory = "Backend", config file path = this file.
# Shares DATABASE_URL, REDIS_URL and every secret with the API service.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "celery -A app.core.celery_app worker --loglevel=info -Q celery,analysis"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
