# Railway configuration for the API service (Root Directory = "Backend").
#
# Analyses run on a separate worker service: create a second Railway service
# from this repository with Root Directory = "Backend" and config file path
# "railway.worker.toml". Without a worker the API falls back to running
# analyses in-process, which ties up a web worker and loses work on restart.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
# Bring the schema up to date before the new release serves traffic. Idempotent
# and serialised by an advisory lock, so concurrent deploys are safe.
preDeployCommand = ["python -m app.db.migrate"]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[healthcheck]
path = "/health"
timeout = 100
interval = 30
