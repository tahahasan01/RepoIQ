# Alembic Configuration for RepoIQ
# Database migration management

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend date and time to migration file names
prepend_sys_path = .

# Timezone for migration file names
timezone = UTC

# Max length of characters in migration file slug
truncate_slug_length = 40

# Set to 'true' to run offline migrations
revision_environment = false

# Set to 'true' to require the use of environments
sourceless = false

# Version table name
version_table = alembic_version

# Version table schema
version_table_schema = public

# Run migration async
version_table_pk = false

[post_write_hooks]
# Hooks called after any successful migration revision generation

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
