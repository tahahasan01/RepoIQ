# Full local stack: Postgres, Redis, schema migration, API and Celery worker.
#
#   docker compose up --build
#
# Postgres and Redis are not published to the host on purpose: the API and
# worker reach them over the compose network, and publishing 5432/6379 would
# collide with any other project using the defaults. The DATABASE_URL and
# REDIS_URL below override whatever .env says, because inside the network the
# hosts are the service names, not localhost.

x-backend: &backend
  build: .
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://repoiq:repoiq_dev@postgres:5432/repoiq
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repoiq
      POSTGRES_PASSWORD: repoiq_dev
      POSTGRES_DB: repoiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoiq -d repoiq"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: python -m app.db.migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: celery -A app.core.celery_app worker --loglevel=info -Q celery,analysis

volumes:
  postgres_data:
  redis_data:
