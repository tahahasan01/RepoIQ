<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoIQ - AI code intelligence for GitHub repositories</title>
    <meta name="description" content="RepoIQ analyzes your GitHub repositories and scores code quality, security and architecture, with AI-generated fixes and team insights." />
    <meta name="author" content="RepoIQ" />
    <meta name="application-name" content="RepoIQ" />

    <!-- Matches the page background of each theme (--background in index.css). -->
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080c16" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:site_name" content="RepoIQ" />
    <meta property="og:title" content="RepoIQ - AI code intelligence for GitHub repositories" />
    <meta property="og:description" content="Analyze, score and improve your GitHub repositories: security insights, architecture review and AI-generated fixes." />
    <meta property="og:type" content="website" />
    <!-- Crawlers resolve a relative og:image against the page URL, which works
         wherever this is hosted; switch to an absolute URL once the production
         domain is fixed, since a few scrapers only accept absolute ones. -->
    <meta property="og:image" content="/opengraph.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RepoIQ - code intelligence for your GitHub repositories" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RepoIQ - AI code intelligence for GitHub repositories" />
    <meta name="twitter:description" content="Analyze, score and improve your GitHub repositories with AI." />
    <meta name="twitter:image" content="/opengraph.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
