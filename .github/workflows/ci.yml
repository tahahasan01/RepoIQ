name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # BACKEND TESTS
  # ============================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repoiq
          POSTGRES_PASSWORD: repoiq_dev
          POSTGRES_DB: repoiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repoiq -d repoiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The same runner every deploy uses, so CI also proves the migrations
      # apply cleanly to an empty database.
      - name: Apply schema to the test database
        working-directory: Backend
        env:
          DATABASE_URL: postgresql://repoiq:repoiq_dev@localhost:5432/repoiq_test
          SECRET_KEY: test_secret_key_for_ci_testing_12345678901234567890
          GITHUB_CLIENT_ID: test_client_id
          GITHUB_CLIENT_SECRET: test_client_secret
          GITHUB_REDIRECT_URI: http://localhost:8000/auth/callback
        run: python -m app.db.migrate

      # Placeholder credentials only: the suite never calls GitHub or Claude,
      # and real secrets have no business in a test process.
      - name: Run tests with coverage
        working-directory: Backend
        env:
          REDIS_URL: redis://localhost:6379/0
          TEST_DATABASE_URL: postgresql://repoiq:repoiq_dev@localhost:5432/repoiq_test
          # Database tests fail instead of skipping when Postgres is missing.
          REQUIRE_TEST_DATABASE: "1"
          SECRET_KEY: test_secret_key_for_ci_testing_12345678901234567890
          GITHUB_CLIENT_ID: test_client_id
          GITHUB_CLIENT_SECRET: test_client_secret
          GITHUB_REDIRECT_URI: http://localhost:8000/auth/callback
          ANTHROPIC_API_KEY: test_anthropic_key
          ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
          PYTHONPATH: ${{ github.workspace }}/Backend
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=25

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: Backend/coverage.xml
          flags: backend
          name: backend-coverage

  # ============================================
  # BACKEND LINT
  # ============================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      # BLOCKING. Undefined names, unused imports/variables and syntax errors
      # fail the build. These are the classes that catch real bugs - an
      # undefined name is a guaranteed NameError at runtime.
      - name: Lint with flake8 (blocking)
        working-directory: Backend
        run: |
          flake8 app/ main.py             --max-line-length=120             --select=E9,F63,F7,F82,F401,F811,F841             --count --statistics

      # ADVISORY. Style only. The codebase predates any formatter, so enforcing
      # these would mean a repo-wide reformat that buries real changes in noise.
      # Reformat deliberately in its own commit, then promote these to blocking.
      - name: Check formatting with Black (advisory)
        working-directory: Backend
        continue-on-error: true
        run: black --check app/ --line-length 120

      - name: Check imports with isort (advisory)
        working-directory: Backend
        continue-on-error: true
        run: isort --check-only app/

      - name: Full flake8 report (advisory)
        working-directory: Backend
        continue-on-error: true
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503 --count --statistics

  # ============================================
  # FRONTEND TESTS
  # ============================================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm install

      # `npm run build -- --noEmit` did not typecheck anything: --noEmit is a
      # tsc flag and this forwards it to vite build, which ignores it. Run tsc.
      - name: Run type check (blocking)
        working-directory: Frontend
        # Not a bare `tsc --noEmit`: the root tsconfig.json has "files": [] and
        # only project references, so that command checks zero files and
        # always passes. The typecheck script names each real project.
        run: npm run typecheck

      - name: Run tests (blocking)
        working-directory: Frontend
        run: npm test -- --run

  # ============================================
  # FRONTEND LINT
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm install

      # ADVISORY until the existing violations are burned down; promote to
      # blocking in the same commit that fixes them.
      - name: Run ESLint (advisory)
        working-directory: Frontend
        continue-on-error: true
        run: npm run lint

  # ============================================
  # SECURITY SCAN
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety

      # BLOCKING on high-confidence, high-severity findings only (-lll -iii).
      # The report artifact below still carries everything for triage.
      - name: Run Bandit security scan (blocking on high severity)
        working-directory: Backend
        run: bandit -r app/ -lll -iii --format screen

      - name: Bandit full report (advisory)
        working-directory: Backend
        continue-on-error: true
        run: bandit -r app/ -ll -ii --format json --output bandit-report.json

      - name: Check dependencies with Safety (advisory)
        working-directory: Backend
        continue-on-error: true
        run: safety check -r requirements.txt --json --output safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            Backend/bandit-report.json
            Backend/safety-report.json

  # ============================================
  # BUILD
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Build Frontend
        working-directory: Frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://localhost:8000/api/v1' }}
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/dist
          retention-days: 7

  # ============================================
  # DEPLOY (only on main branch push)
  # ============================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: Frontend/dist

      - name: Deploy notification
        run: |
          echo "🚀 Ready for deployment!"
          echo "Frontend build available in Frontend/dist"
          echo "Backend ready for deployment"
          # Add your deployment steps here (e.g., deploy to Vercel, Railway, etc.)
